name: Render Manuscript

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: signbase:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Render Quarto Document
        run: |
          docker run --name render-container signbase:latest \
            quarto render paper/paper.qmd --to docx

      - name: Download .docx from Container
        run: |
          docker cp render-container:/project/paper/paper.docx ./paper.docx

      - name: Upload to Summary Page
        uses: actions/upload-artifact@v4
        with:
          name: Manuscript-Word-Doc
          path: paper.docx
          retention-days: 7
